name: CI

concurrency:
  group: clipshow-cn-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, "feature/*"]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install FFmpeg (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libegl1 libgl1 libopengl0

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y

      - name: Install dependencies
        run: uv pip install --system -e ".[test]"

      - name: Lint with ruff
        run: ruff check clipshow/ scripts/check_chinese_ui.py

      - name: Compile Python sources
        run: python -m compileall -q clipshow

      - name: Check Chinese UI and launch GUI offscreen
        run: python scripts/check_chinese_ui.py
        env:
          QT_QPA_PLATFORM: offscreen
